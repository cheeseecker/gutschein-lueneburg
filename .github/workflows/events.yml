name: Events aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Events aus Google Sheet holen
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node scripts/fetch-events.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add content/events.json src/assets/events
          if git diff --cached --quiet; then
            echo "Keine Änderungen – löse trotzdem Neubau aus."
            if [ -n "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then curl -s -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"; fi
          else
            git commit -m "Events aktualisiert $(date +'%Y-%m-%d')"
            git push
          fi
